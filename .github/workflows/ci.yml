name: CI

# Gate before merge. Runs on PRs into main, and on push to main for the
# direct-push cases this repo has actually used (e.g. small config/doc
# fixes cherry-picked straight onto main rather than routed through a PR).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # Valid YAML isn't the same as a valid GitHub Actions workflow --
    # actionlint catches schema-level mistakes (bad expression contexts,
    # wrong job/step nesting, etc.) that a push would otherwise only
    # surface after the fact as a failed run. Same rationale and tool as
    # propersloth/parallax-threejs's ci.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  test:
    runs-on: ubuntu-latest
    # No database service here -- tests/setup.ts sets GSP_DISABLE_DB=true
    # for every default `npm test` run, and the suites that do need a live
    # database (tests/unit/database/schema.spec.ts and
    # tests/integration/compliance.spec.ts) are excluded from that run and
    # covered separately by the schema-test and compliance-test jobs below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc's own incremental cache (tsconfig.json has "incremental": true).
      # Verified locally where this actually lands: tsc writes
      # ./tsconfig.build.tsbuildinfo at the project root, NOT inside dist/
      # -- it does not follow outDir. Both dist/ and the buildinfo file
      # MUST be cached and restored together: tsc's incremental check
      # trusts the buildinfo's source-file hashes and does not itself
      # verify the emitted output files still exist, so a restored
      # buildinfo without a matching dist/ (e.g. dist/ deleted but the
      # buildinfo kept, as happened locally while testing this) makes tsc
      # skip re-emitting files it wrongly believes are already current --
      # confirmed this exact failure mode locally before writing this.
      # Keyed on the SHA with a restore-keys fallback to the most recent
      # cache available -- tsc's incremental compiler diffs against
      # whatever it restores and only recompiles what actually changed,
      # so an approximate (not exact-lockfile-match) restore is correct
      # here, unlike the dependency cache above.
      - name: Cache TypeScript incremental build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            tsconfig.build.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-

      - name: Build
        run: npm run build

      # ts-jest's compile cache (jest.config.js sets cacheDirectory to
      # .jest-cache explicitly, rather than the OS-temp-dir default, so it's
      # a stable path to cache). Same restore-keys reasoning as above --
      # ts-jest recompiles per-file on a cache miss for that file, so a
      # near-match restore still saves most of the work.
      - name: Cache ts-jest compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-

      - name: Test
        run: npm test

  schema-test:
    runs-on: ubuntu-latest
    # tests/unit/database/schema.spec.ts runs real migrations against a
    # real Postgres and asserts on the resulting schema/data -- it's
    # deliberately excluded from `npm test` (see jest.config.js /
    # package.json's test script) because it needs a live database, not
    # because it's optional. Kept as its own job rather than folded into
    # `test` so a missing/misconfigured DB service failure is immediately
    # attributable to this job, not the DB-free suite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gsp
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gsp -d gsp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same ts-jest compile cache as the test job (schema.spec.ts runs
      # through Jest/ts-jest too, via npm run test:schema) -- separate cache
      # key/scope so this job's smaller, DB-focused test doesn't evict or
      # conflict with the test job's cache entry.
      - name: Cache ts-jest compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-schema-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-schema-

      - name: Run schema migration tests
        env:
          TEST_DATABASE_URL: postgresql://gsp:test@localhost:5432/gsp_test
        run: npm run test:schema

  compliance-test:
    runs-on: ubuntu-latest
    # tests/integration/compliance.spec.ts (GSP-041) is the full G1-G9 URD
    # exit-gate suite and runs against a live Postgres for real -- G8 (PATCH
    # atomicity) and G9 (concurrency control) depend on real transaction
    # isolation and advisory locks that a mock can't exercise. Deliberately
    # excluded from `npm test` for the same reason schema.spec.ts is (see
    # the schema-test job above and package.json's test script). The suite
    # runs its own migrations in beforeAll, so no separate migration step is
    # needed here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gsp
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gsp -d gsp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same ts-jest compile cache strategy as the test/schema-test jobs --
      # separate cache key/scope so this job doesn't evict or conflict with
      # either of those.
      - name: Cache ts-jest compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-compliance-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-compliance-

      - name: Run compliance suite
        env:
          TEST_DATABASE_URL: postgresql://gsp:test@localhost:5432/gsp_test
        run: npm run test:compliance
