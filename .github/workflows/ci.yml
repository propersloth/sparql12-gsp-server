name: CI

# Gate before merge. Runs on PRs into main, and on push to main for the
# direct-push cases this repo has actually used (e.g. small config/doc
# fixes cherry-picked straight onto main rather than routed through a PR).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # Valid YAML isn't the same as a valid GitHub Actions workflow --
    # actionlint catches schema-level mistakes (bad expression contexts,
    # wrong job/step nesting, etc.) that a push would otherwise only
    # surface after the fact as a failed run. Same rationale and tool as
    # propersloth/parallax-threejs's ci.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  test:
    runs-on: ubuntu-latest
    # No database service here -- tests/setup.ts sets GSP_DISABLE_DB=true
    # for every default `npm test` run, and the one suite that does need a
    # live database (tests/unit/database/schema.spec.ts) is excluded from
    # that run and covered separately by the schema-test job below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  schema-test:
    runs-on: ubuntu-latest
    # tests/unit/database/schema.spec.ts runs real migrations against a
    # real Postgres and asserts on the resulting schema/data -- it's
    # deliberately excluded from `npm test` (see jest.config.js /
    # package.json's test script) because it needs a live database, not
    # because it's optional. Kept as its own job rather than folded into
    # `test` so a missing/misconfigured DB service failure is immediately
    # attributable to this job, not the DB-free suite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gsp
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gsp -d gsp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run schema migration tests
        env:
          TEST_DATABASE_URL: postgresql://gsp:test@localhost:5432/gsp_test
        run: npm run test:schema
